<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#416fc3">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: https://warehouse-vehicle-flow-api.somchaibutphon.workers.dev; connect-src 'self' https://warehouse-vehicle-flow-api.somchaibutphon.workers.dev; worker-src 'self' blob:">
  <script>
    (()=>{
      try{
        const url=new URL(location.href);
        let changed=false;
        ["name","password","username","pass"].forEach(key=>{if(url.searchParams.has(key)){url.searchParams.delete(key);changed=true}});
        if(changed)history.replaceState(null,"",`${url.pathname}${url.search}${url.hash}`);
      }catch{}
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ระบบบริหารรถขนส่ง</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css?v=20260829-r20735">
</head>
<body>
  <div id="connectionBanner" class="connection-banner" hidden>การเชื่อมต่อขัดข้อง กำลังลองใหม่</div>

  <main id="loginView" class="login-view">
    <section class="login-hero" aria-hidden="true"><div class="warehouse-art"><span class="spectrum-mark spectrum-mark-large"><i></i><i></i><i></i><i></i><i></i><i></i></span></div><h1>ระบบบริหารรถขนส่ง</h1><p>ติดตามงานภายในคลังตั้งแต่รถเข้าจนออกจากพื้นที่</p></section>
    <form id="loginForm" class="login-card">
      <header><h2>เข้าสู่ระบบ</h2><p id="thaiClock">--/--/---- --:--:--</p></header>
      <label>ชื่อผู้ใช้<input id="loginName" name="name" autocomplete="username" required maxlength="120" placeholder="กรอกชื่อผู้ใช้"></label>
      <label>รหัสผ่าน<div class="password-field"><input id="loginPassword" name="password" type="password" autocomplete="current-password" required maxlength="200" placeholder="กรอกรหัสผ่าน"><button type="button" id="togglePassword" aria-label="แสดงหรือซ่อนรหัสผ่าน">ดู</button></div></label>
      <button class="primary login-button" type="submit">เข้าสู่ระบบ</button>
      <p id="loginMessage" class="form-message" role="alert"></p>
    </form>
  </main>

  <div id="appView" class="app-shell" hidden>
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><span class="spectrum-mark"><i></i><i></i><i></i><i></i><i></i><i></i></span></span><div><strong id="brandName">ระบบบริหารรถขนส่ง</strong><small>คลังสินค้า</small></div></div>
      <nav id="sideNav"></nav>
      <div class="account"><b id="accountName">-</b><small id="accountRole">-</small><button id="logoutButton">ออกจากระบบ</button></div>
    </aside>

    <section class="content">
      <header class="topbar"><button id="menuButton" class="menu-button" aria-label="เปิดเมนูเพิ่มเติม">☰</button><div class="topbar-title"><h1 id="pageTitle">งานรับสินค้า</h1><p id="headerClock">--/--/---- --:--:--</p></div><span id="syncStatus" class="sync-status">● พร้อมใช้งาน</span><div id="mobileAccount" class="mobile-account"><button id="mobileAccountButton" class="mobile-account-button" type="button" aria-label="เปิดบัญชีและเมนูเพิ่มเติม" title="บัญชีผู้ใช้งาน"><i aria-hidden="true">U</i><span class="mobile-account-copy"><b id="mobileAccountName">-</b><small>บัญชี</small></span></button></div></header>
      <div id="pageContent" class="page-content" aria-live="polite"></div>
    </section>
    <nav id="mobileNav" class="mobile-nav"></nav>
    <div id="mobileMoreSheet" class="mobile-more-sheet" hidden>
      <button class="mobile-more-backdrop" type="button" data-mobile-more-close aria-label="ปิดเมนู"></button>
      <section class="mobile-more-panel" role="dialog" aria-modal="true" aria-labelledby="mobileMoreTitle">
        <header><div><small>เมนูและบัญชี</small><b id="mobileMoreTitle">เพิ่มเติม</b></div><button type="button" data-mobile-more-close aria-label="ปิด">×</button></header>
        <div id="mobileMoreMenu" class="mobile-more-menu"></div>
      </section>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden><b>✓</b><span></span></div>
  <script src="./sweetalert2.all.min.js"></script>
  <script src="./jsqr.js"></script>
  <script src="./config.js?v=20260818-r178c"></script>
  <script src="./app.js?v=20260829-r20735"></script>
</body>
</html>
